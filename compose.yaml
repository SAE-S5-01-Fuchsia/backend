# Lancement local avec Docker : docker compose up --build
# Le code de app/ est monté dans le conteneur et rechargé à chaque modification.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
